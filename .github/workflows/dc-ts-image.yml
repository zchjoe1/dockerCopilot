name: dc-ts image

on:
  push:
    branches: [feat/ts-ui]
    paths: ['ts/**', '.github/workflows/dc-ts-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ts
          file: ts/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dc-ts:latest
            ghcr.io/${{ github.repository_owner }}/dc-ts:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
