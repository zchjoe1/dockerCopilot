name: docker-build-push-latest-stable

on:
  workflow_dispatch:
  push:
    branches:
      - latest
      - agent/dsh/local-merge   # 2026-11-02：本地功能+私有仓修复的合并分支，构建同一 :latest
    paths:
      - version

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v3
        with:
          repository: dongshull/Docker-Copilot-React
          path: './frontend'
          ref: 'master'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-front-dist
          path: frontend/dist

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v3

      # 【2026-11-02】仓库里若已提交 front/index.html，就**用它**，不要被上游前端覆盖。
      # 原因：本 fork 的 front/ 是定制前端（带「设置」和「Compose」页面，379KB），
      # 而上游 dongshull 的 master 构建产物没有这两个页面（382KB）。此前 CI 无条件覆盖，
      # 导致每次构建出来的 UI 都缺这两块功能（实测服务端下发 设置=0 次 / Compose=5 次）。
      - name: 判断是否使用仓库自带前端
        id: front_choice
        run: |
          if [ -f front/index.html ]; then
            echo "use_repo=true" >> "$GITHUB_OUTPUT"
            echo "使用仓库自带的 front/（定制前端）"
          else
            echo "use_repo=false" >> "$GITHUB_OUTPUT"
            echo "仓库无 front/，使用上游构建产物"
          fi

      - name: Download Frontend Artifacts
        if: steps.front_choice.outputs.use_repo != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-front-*
          merge-multiple: true
          path: front

      - run: ls -R front

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/msaber-back/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.4'
          cache: false

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o dist/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare Files
        run: |
          mkdir -p dc-back-${{ matrix.arch }}
          cp -r dist dc-back-${{ matrix.arch }}/dist
          cp -r etc dc-back-${{ matrix.arch }}/etc

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact-backend-${{ matrix.arch }}
          path: dc-back-${{ matrix.arch }}

  docker-setup:
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    steps:
      - name: Checkout code Now Code
        uses: actions/checkout@v3

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: my-artifact-backend-*
          merge-multiple: true
          path: dc-back

      - run: ls -R dc-back

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Docker Login
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}/dockercopilot:latest
          push: true