name: build-local

# 本地定制版的镜像构建。与上游 workflow 的区别：
#   1) 前端不重新构建 —— front/ 已入库（用户在用的那版界面源码已不可得）
#   2) 只构建 linux/amd64
#   3) 推到 zchjoe/dockercopilot:local（不覆盖上游的 latest / latest-dev 标签）
on:
  push:
    branches: [ 'local/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build binary
        run: |
          mkdir -p dc-back/dist/linux/amd64 dc-back/etc
          cp -r etc/. dc-back/etc/
          # ⚠️ CGO_ENABLED=0 必须带上：否则二进制是动态链接的，Alpine 上没有 glibc
          #    解释器，容器启动会以 127（command not found）退出。
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -a --trimpath \
            -ldflags="-w -s \
              -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=v2.1.3-local' \
              -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dc-back/dist/linux/amd64/dockerCopilot .
          ls -la dc-back/dist/linux/amd64/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            zchjoe/dockercopilot:local
            zchjoe/dockercopilot:local-${{ github.run_number }}
